<style>
@font-face{font-family:'Plus Jakarta Sans';font-weight:500 800;src:local('Plus Jakarta Sans'),local('PlusJakartaSans')}
:root{--bg:#fbf7ef;--fg:#1f2933;--card:#fff;--ac:#2f6f9f;--ac2:#e8f1f8;--ok:#2e7d32;--bad:#b3261e;--bd:#d9d2c3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a1f;--fg:#f1f3f5;--card:#232830;--ac:#5aa6d8;--ac2:#27323d;--ok:#7bc67e;--bad:#ff8a80;--bd:#3a424d}}
:root[data-theme="dark"]{--bg:#171a1f;--fg:#f1f3f5;--card:#232830;--ac:#5aa6d8;--ac2:#27323d;--ok:#7bc67e;--bad:#ff8a80;--bd:#3a424d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:22px/1.4 'Fredoka','Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 16px 32px}
header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
h1{font-size:1.2rem;margin:0;flex:1}h2{font-size:1.1rem}
.in,.m{text-align:center;margin:8px 0}.m{min-height:2.8em;font-weight:700}
.b{font:inherit;font-weight:700;padding:14px 18px;border-radius:16px;border:3px solid var(--ac);background:var(--ac);color:#fff;min-height:60px;width:100%;margin:6px 0;cursor:pointer}
.b.s{background:var(--card);color:var(--ac)}
header .b{width:auto;min-height:48px;padding:8px 14px;margin:0}
.c{display:flex;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0;cursor:pointer}
.c .e{font-size:2.4rem}.c small{font-size:.75em;opacity:.8}
.gr{display:grid;gap:10px;margin:10px 0}
.cd,.sm{font:inherit;font-size:2.2rem;height:92px;border-radius:16px;border:3px solid var(--bd);background:var(--ac2);color:var(--fg);cursor:pointer}
.cd.up{background:var(--card)}.cd.ok{background:#c8e6c9;border-color:var(--ok);color:#1f2933}
.cd.lit2,.cd.on{background:var(--ac);border-color:var(--ac)}
.sm{height:120px;color:#fff;font-size:1.2rem;font-weight:700;border-color:transparent;text-shadow:0 1px 3px #000}
.sm.lit{filter:brightness(1.7);transform:scale(1.05);outline:6px solid #fff}
.wl{text-align:center;font-size:1.5rem;font-weight:700;line-height:2;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px;margin:10px 0}
.b.w.on{background:var(--ac);color:#fff}
.nm{font-size:2.4rem;font-weight:700;text-align:center;letter-spacing:.1em;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:18px;margin:10px 0;min-height:1.4em}
.b.good{background:var(--ok);border-color:var(--ok);color:#fff}.b.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.r{text-align:center}.big{font-size:4rem}
body{background:radial-gradient(circle at 15% 0,hsl(30 80% 60%/.18),transparent 45%),radial-gradient(circle at 90% 20%,hsl(200 70% 55%/.18),transparent 45%),var(--bg);min-height:100vh}
h1{font-size:1.35rem;background:linear-gradient(90deg,var(--ac),#e76f51);-webkit-background-clip:text;background-clip:text;color:transparent}
.b{box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s}.b:active{transform:translateY(4px);box-shadow:none}
.c{--h:200;background:linear-gradient(135deg,hsl(var(--h) 70% 55%/.22),var(--card));border:2px solid hsl(var(--h) 60% 55%/.5);border-left:9px solid hsl(var(--h) 60% 50%);box-shadow:0 6px 16px rgba(0,0,0,.12);transition:transform .15s}.c:active{transform:scale(.98)}
.c .e{width:68px;height:68px;flex:none;display:grid;place-items:center;border-radius:50%;background:hsl(var(--h) 70% 55%/.28);font-size:2.2rem}
.cd{background:linear-gradient(160deg,var(--ac2),var(--card));box-shadow:0 5px 0 rgba(0,0,0,.15),inset 0 0 0 2px hsl(210 40% 70%/.4)}
.cd.up{animation:fl .3s}.cd.ok{animation:pop .45s}
@keyframes fl{from{transform:rotateY(90deg)}to{transform:none}}@keyframes pop{50%{transform:scale(1.14)}}
.sm{box-shadow:0 6px 0 rgba(0,0,0,.3),inset 0 4px 10px rgba(255,255,255,.35)}
.nm,.wl{box-shadow:0 4px 14px rgba(0,0,0,.1)}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#f4a261);transition:width .4s}
.cf{position:fixed;top:-40px;animation:fall 2.8s linear forwards;pointer-events:none;z-index:9}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.r .big{animation:pop .8s}
body{--gh:30;background:radial-gradient(circle at 12% 0,hsl(var(--gh) 80% 60%/.28),transparent 50%),radial-gradient(circle at 92% 28%,hsl(calc(var(--gh) + 160) 70% 55%/.22),transparent 50%),radial-gradient(circle at 20% 100%,hsl(calc(var(--gh) + 80) 70% 60%/.2),transparent 50%),var(--bg);background-attachment:fixed}
#a>*{animation:sl .4s both}#a>*:nth-child(2){animation-delay:.06s}#a>*:nth-child(3){animation-delay:.12s}#a>*:nth-child(4){animation-delay:.18s}#a>*:nth-child(5){animation-delay:.24s}
@keyframes sl{from{opacity:0;transform:translateY(14px)}}
.hero{position:relative;overflow:hidden;display:flex;gap:16px;align-items:center;color:#fff;background:linear-gradient(120deg,#2f6f9f,#6a4c93 55%,#e76f51);border-radius:24px;padding:18px;margin:6px 0 12px;box-shadow:0 10px 24px rgba(60,40,120,.3)}
.hero::before{content:'✨ 🌸 ⭐';position:absolute;right:10px;top:4px;opacity:.35;font-size:1.6rem;letter-spacing:8px}
.hb{font-size:3.6rem;animation:fl2 3s ease-in-out infinite}@keyframes fl2{50%{transform:translateY(-8px) rotate(7deg)}}
.hero>div:last-child{flex:1}.hero small{opacity:.95}
.c>span:last-child{flex:1}
h2+.gr{grid-template-columns:repeat(5,1fr)!important}
.lb{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;border-radius:50%;border:3px solid hsl(var(--gh) 55% 50%);background:var(--card);color:var(--fg);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);padding:0}
.lb b{font-size:1.3rem}.lb small{font-size:.7rem}.lb.d{background:hsl(var(--gh) 65% 52%);color:#fff}.lb.nx{animation:pu 1.4s infinite}@keyframes pu{50%{transform:scale(1.1)}}
.cd{background:repeating-linear-gradient(45deg,hsl(var(--gh) 60% 52%),hsl(var(--gh) 60% 52%) 9px,hsl(var(--gh) 60% 60%) 9px,hsl(var(--gh) 60% 60%) 18px);color:#fff;border-color:hsl(var(--gh) 55% 40%)}
.cd.up{background:var(--card);color:var(--fg)}
.sm{position:relative;overflow:hidden;border-radius:30px}.sm::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.45),transparent 55%)}
.sm.lit{box-shadow:0 0 38px 14px rgba(255,255,255,.7)}
.ch{display:inline-block;margin:6px;padding:6px 18px;border-radius:30px;background:hsl(var(--h) 70% 55%/.25);border:2px solid hsl(var(--h) 60% 50%)}
.wl{line-height:1.5}
.nm{background:linear-gradient(160deg,var(--card),var(--ac2))}
.st span{display:inline-block;font-size:2.4rem;animation:stp .7s both}.st span:nth-child(2){animation-delay:.2s}.st span:nth-child(3){animation-delay:.4s}
@keyframes stp{from{transform:scale(0) rotate(-120deg)}to{transform:none}}
.ls{display:flex;gap:8px;align-items:center;margin:2px 0 10px}
.lp{font:inherit;font-weight:700;height:52px;width:64px;border-radius:16px;border:3px solid hsl(var(--gh) 55% 50%);background:hsl(var(--gh) 65% 50%);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);padding:0}
.lp.mid{flex:1;width:auto;background:var(--card);color:var(--fg);font-size:1rem}
.lp:disabled{opacity:.3;box-shadow:none;cursor:default}
.mb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:10px 14px;margin:4px 0 10px;font-size:.8rem}.mb .mi{font-size:1.8rem}.mb .mt{flex:1;min-width:140px}.mb small{opacity:.75}.mb .b{width:auto;min-height:48px;padding:8px 14px;margin:0;font-size:.85rem}.mb input{width:90px;accent-color:var(--ac)}
.stt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}.stt div{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:8px 4px;text-align:center}.stt b{display:block;font-size:1.3rem}.stt span{display:block;font-size:.7rem;opacity:.8;line-height:1.2}

/* ===== Visuel amélioré ===== */
main{max-width:640px}
body{background:radial-gradient(circle at 10% 0,hsl(var(--gh) 85% 65%/.35),transparent 45%),radial-gradient(circle at 95% 15%,hsl(calc(var(--gh) + 150) 75% 60%/.3),transparent 45%),radial-gradient(circle at 30% 100%,hsl(calc(var(--gh) + 80) 80% 65%/.28),transparent 50%),var(--bg);background-attachment:fixed;transition:background 1s}
.hero2{display:flex;gap:16px;align-items:center;color:#fff;background:linear-gradient(120deg,#2f6f9f,#6a4c93 55%,#e76f51);border-radius:28px;padding:18px 20px;margin:6px 0 14px;box-shadow:0 12px 28px rgba(60,40,120,.3)}.hero2 .hb{font-size:3.4rem;animation:fl2 3s ease-in-out infinite}.hero2 b{font-size:1.4rem}.hero2 small{opacity:.95}
.cta{display:block;width:100%;font:inherit;font-weight:700;font-size:1.5rem;padding:24px 16px;border:0;border-radius:30px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff8a3d,#e63e78 55%,#7b4bd6);box-shadow:0 9px 0 rgba(110,30,80,.4),0 18px 36px rgba(230,62,120,.35);animation:glow 2.6s ease-in-out infinite}.cta:active{transform:translateY(7px);box-shadow:0 2px 0 rgba(110,30,80,.4)}
@keyframes glow{50%{filter:brightness(1.12) saturate(1.15)}}
.chips{display:flex;gap:10px;justify-content:center;margin:16px 0 8px}.chips span{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:var(--card);box-shadow:0 4px 12px rgba(0,0,0,.14);border:2px solid var(--bd)}
.gp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.tile{--h:200;position:relative;overflow:hidden;font:inherit;color:var(--fg);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:14px 14px 18px;border-radius:22px;border:2px solid hsl(var(--h) 60% 60%/.5);background:linear-gradient(150deg,hsl(var(--h) 80% 60%/.25),var(--card));box-shadow:0 6px 16px rgba(0,0,0,.12);transition:transform .15s}.tile:active{transform:scale(.97)}.tile .e{font-size:2.2rem}.tile b{font-size:.95rem;line-height:1.15}.tile small{font-size:.7rem;opacity:.8}.tile i{position:absolute;left:0;bottom:0;height:7px;background:hsl(var(--h) 70% 50%);border-radius:0 6px 0 0}
.gh{display:flex;gap:14px;align-items:center;margin:2px 0 8px}.gh b{font-size:1.25rem;display:block}.gh small{opacity:.75;font-size:.75rem}.ge{font-size:2.4rem;width:68px;height:68px;border-radius:22px;display:grid;place-items:center;background:hsl(var(--gh) 75% 55%/.28);box-shadow:inset 0 0 0 2px hsl(var(--gh) 60% 50%/.5)}
.hp{font-size:.75rem;opacity:.85;margin:4px 6px 10px;text-align:center}
#g{background:var(--card);border-radius:28px;padding:16px;box-shadow:0 14px 34px rgba(0,0,0,.14);border:2px solid hsl(var(--gh) 50% 75%/.6);min-height:120px}
.b.bad{animation:shake .4s}.b.good{animation:pop .45s}@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.b{background:linear-gradient(180deg,hsl(var(--gh) 70% 58%),hsl(var(--gh) 70% 46%));border-color:hsl(var(--gh) 65% 40%)}.b.s{background:var(--card);border-color:hsl(var(--gh) 55% 55%);color:var(--fg)}.b.good{background:var(--ok)!important;color:#fff!important}.b.bad{background:var(--bad)!important;color:#fff!important}
.cd{transform-style:preserve-3d}.cd.up{animation:fl .35s}
.nm{border-radius:22px;border:2px solid hsl(var(--gh) 50% 75%/.6)}
.mb{position:sticky;top:0;z-index:5;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--card) 88%,transparent)}

/* ===== Nono Memo : look moderne ===== */
:root{--bg:#f3f4f7;--fg:#141922;--card:#fff;--ac:#4a63e7;--ac2:#eceffd;--ok:#12805c;--bad:#c93a3a;--bd:#e1e4ec;--mu:#6a7385}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1017;--fg:#eef1f7;--card:#161c27;--ac:#5470ff;--ac2:#1b2333;--ok:#4cd6a0;--bad:#ff7a7a;--bd:#262e3d;--mu:#8e98ad}}
:root[data-theme="dark"]{--bg:#0c1017;--fg:#eef1f7;--card:#161c27;--ac:#5470ff;--ac2:#1b2333;--ok:#4cd6a0;--bad:#ff7a7a;--bd:#262e3d;--mu:#8e98ad}
body{font-family:'Outfit',system-ui,sans-serif;background:radial-gradient(60% 40% at 50% -10%,color-mix(in srgb,var(--ac) 20%,transparent),transparent),var(--bg);background-attachment:fixed}
header{padding:6px 0 10px}
#brand{font:italic 700 2.1rem/1 'Fraunces',Georgia,serif;margin:0;flex:1;background:linear-gradient(90deg,var(--ac),#e0709a);-webkit-background-clip:text;background-clip:text;color:transparent}
#ck{text-align:right;line-height:1.1}#ck b{display:block;font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}#ck small{font-size:.62rem;color:var(--mu);text-transform:capitalize}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.14em;color:var(--mu);font-weight:600}
.hp,.in{color:var(--mu)}
.hero2{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:22px;box-shadow:none}
.hero2 .hb{animation:none;font-size:2.4rem}.hero2 b{font-size:1.8rem;font-weight:600}.hero2 small{color:var(--mu)}
.cta{background:var(--ac);border-radius:20px;font-size:1.2rem;padding:20px;box-shadow:0 12px 28px -12px var(--ac);animation:none}.cta:active{transform:scale(.98);box-shadow:none}
.chips span{border-radius:14px;box-shadow:none}
.tile{background:var(--card);border:1px solid var(--bd);border-top:3px solid hsl(var(--h) 70% 60%);border-radius:18px;box-shadow:none}.tile b{font-weight:600}
.b{background:var(--ac);border:0;border-radius:16px;box-shadow:none;font-weight:600;color:#fff}.b:active{transform:scale(.98);box-shadow:none}
.b.s{background:var(--card);border:1px solid var(--bd);color:var(--fg)}
.b.good{background:var(--ok)!important;color:#fff!important}.b.bad{background:var(--bad)!important;color:#fff!important}
.cd{background:var(--ac2);color:var(--mu);border:1px solid var(--bd);border-radius:16px;box-shadow:none}
.cd.up{background:var(--card);color:var(--fg)}.cd.ok{background:color-mix(in srgb,var(--ok) 25%,var(--card));border-color:var(--ok);color:var(--fg)}
.cd.lit2,.cd.on{background:var(--ac);border-color:var(--ac)}
.nm,.wl,#g{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:none}
.ch{border-radius:12px}
.sm{border-radius:20px;box-shadow:none;text-shadow:none}.sm::after{display:none}
.mb{border-radius:18px;border:1px solid var(--bd)}
.stt div{border-radius:14px}
.gh .ge{border-radius:16px;background:var(--ac2);box-shadow:none}
.bar i{background:var(--ac)}
/* ===== Nono Memo : édition élégante ===== */

if(!ok())return;sc+=k?1:0;await sl(1400);if(!ok())return}
d(sc>=4,sc+' bonnes réponses sur 5.')};

G.calcul={n:'Le calcul tranquille',e:'➕',d:'Raisonnement',h:'Faites un petit calcul de tête, sans vous presser.',f:mc((l)=>{const mx=[9,12,15,20,30,40,50,70,90,120][l-1],op=l<4?'+':l<8?R1(['+','−']):R1(['+','−','×']);let a,b,r;

G.logique={n:'La logique douce',e:'🪄',d:'Logique',h:'Trouvez le nombre qui vient ensuite dans la suite.',f:mc((l)=>{let t=[];const k=l<4?0:l<7?R1([0,1]):R1([0,1,2]);
if(k===0){const st=N1(2,l<4?5:12),s0=N1(1,10);t=Array.from({length:5},(_,i)=>s0+i*st)}

else{const s0=N1(1,5);t=Array.from({length:5},(_,i)=>s0*2**i)}

const askq=(b,m,q,a,w,l)=>{const ch=sh([a,...sh(w.filter(x=>x!=a)).slice(0,NC(l)-1)]);b.innerHTML=`<div class="qn">${q}</div>`+ch.map(x=>`<button class="b s" data-a="${x}">${x}</button>`).join('');say(q);return new Promise(res=>b.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{b.querySelectorAll('button').forEach(x=>x.onclick=null);const o=e.dataset.a==a;e.className='b '+(o?'good':'bad');m(o?'Exact !':'La réponse : '+a);res(o)}))};

G.serie={n:'Calculs en série',e:'⚡',d:'Calcul mental rapide',h:'Résolvez les calculs l’un après l’autre. Tapez la réponse sur le clavier, puis validez avec ✔. Le temps n’est donné qu’à titre indicatif.',async f(l,b,m,d,ok){const n=10,mx=[9,10,12,15,20,25,30,40,50,60][l-1],t0=Date.now();let i=0,sc=0,v='';
const mk=()=>{const op=l<3?'+':R1(l<6?['+','−']:['+','−','×']);let a,c,r;if(op==='×'){a=N1(2,l>8?9:6);c=N1(2,l>8?9:5);r=a*c}else if(op==='+'){a=N1(1,mx);c=N1(1,mx);r=a+c}else{a=N1(Math.ceil(mx/2),mx);c=N1(1,Math.floor(mx/2));r=a-c}return[a+' '+op+' '+c,r]};
const q=Array.from({length:n},mk);
const show=()=>{v='';b.innerHTML=bar(i,n)+`<div class="nm" style="letter-spacing:0">${q[i][0]} = ?</div><div class="nm" id="vv" style="min-height:1.4em">&nbsp;</div><div class="gr" style="grid-template-columns:repeat(3,1fr)">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✔'].map(x=>`<button class="b s${x==='⌫'?' kr':x==='✔'?' kv':''}" data-k="${x}">${x}</button>`).join('')}</div>`;m('Calcul '+(i+1)+' sur '+n);
b.querySelectorAll('[data-k]').forEach(e=>e.onclick=async()=>{const k=e.dataset.k;
if(k==='⌫')v=v.slice(0,-1);
else if(k==='✔'){if(!v)return;const g=+v===q[i][1];sc+=g?1:0;const z=$('#vv');z.textContent=g?'✔ '+v:'✘ '+q[i][1];z.style.color=g?'var(--ok)':'var(--bad)';b.querySelectorAll('button').forEach(x=>x.onclick=null);await sl(g?700:1500);if(!ok())return;if(++i<n)show();else d(sc>=8,sc+' bonnes réponses sur '+n+' en '+Math.round((Date.now()-t0)/1000)+' secondes.');return}
else if(v.length<4)v+=k;
$('#vv').textContent=v||'\u00a0'})};show()}};

G.maison={n:'Qui est dans la maison ?',e:'🏠',d:'Calcul et mémoire de travail',h:'La maison est vide au départ. Des personnes entrent et sortent : comptez bien, puis dites combien il en reste à l’intérieur.',async f(l,b,m,d,ok){const R=4,k=Math.min(2+Math.ceil(l/2),7);let sc=0;

for(let i=0;i<k;i++){const x=ev[i],a=Math.abs(x),t=a+(x>0?(a>1?' personnes entrent':' personne entre'):(a>1?' personnes sortent':' personne sort')),ps='🧑'.repeat(a);

b.innerHTML='<div class="nm" style="min-height:9rem"></div>';await sl(400);if(!ok())return}
const g=num(c,l),o=await askq(b,m,'Combien de personnes sont dans la maison ?',g.a,g.w,l);if(!ok())return;sc+=o?1:0;await sl(1500);if(!ok())return}

if(!ok())return;sc+=o?1:0;await sl(o?600:1300);if(!ok())return}
